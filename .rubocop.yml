AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - 'db/migrate/**/*'
    - 'lib/generators/**/*'
    - 'test/install_generator_test.rb'

# Relax metrics for test files, generators, migrations, and dense AB runtime modules
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_ab_tests/assignment_resolver.rb'
    - 'lib/recording_studio_ab_tests/lifecycle.rb'

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_ab_tests/lifecycle.rb'
    - 'lib/recording_studio_ab_tests/eligibility.rb'

Metrics/BlockLength:
  Exclude:
    - 'lib/recording_studio_ab_tests/lifecycle.rb'
    - 'lib/generators/**/*'

Naming/PredicateMethod:
  Exclude:
    - 'lib/recording_studio_ab_tests/lifecycle.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'lib/recording_studio_ab_tests/**/*'
    - 'app/models/recording_studio_ab_tests/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'lib/recording_studio_ab_tests/**/*'
    - 'app/models/recording_studio_ab_tests/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_ab_tests/**/*'
    - 'db/migrate/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_ab_tests/**/*'
    - 'db/migrate/**/*'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_ab_tests/**/*'

Naming/PredicatePrefix:
  Exclude:
    - 'lib/recording_studio_ab_tests/assignment_resolver.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'test/services/**/*'
